[project]
name = "judicore-backend"
version = "0.1.0"
description = "Authoritative ingestion and retrieval backend for the Judicore legal database builder"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3.6,<1",
  "ocrmypdf>=16,<17",
  "PyMuPDF>=1.24,<2",
  "python-multipart>=0.0.18,<1",
  "orjson>=3.10,<4",
  "structlog>=24.4,<26",
  "tenacity>=9,<10",
  "sentence-transformers>=3.3,<6",
  "numpy>=2,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.28,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "testcontainers[postgres]>=4.9,<5",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
